name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build Brusca.Infrastructure/Brusca.Infrastructure.csproj --configuration Release --no-restore /p:Version=${{ steps.ver.outputs.version }}

      - name: Pack
        run: dotnet pack Brusca.Infrastructure/Brusca.Infrastructure.csproj --configuration Release --no-build --output nupkgs /p:Version=${{ steps.ver.outputs.version }}

      - name: Push to GitHub Packages
        run: dotnet nuget push "nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/Out-Of-Box-Thinking/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Push to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusca.Infrastructure-${{ steps.ver.outputs.version }}
          path: nupkgs/*.nupkg
